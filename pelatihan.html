<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      background: radial-gradient(circle at top left, #0d53ff 0%, #00145a 48%, #000f47 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 42vw;
      height: 42vw;
      min-width: 260px;
      min-height: 260px;
      border-radius: 50%;
      background: rgba(77, 163, 255, .16);
      filter: blur(75px);
      pointer-events: none;
      animation: glow 6s ease-in-out infinite alternate;
    }
    body::before { top: -15%; left: -10%; }
    body::after { right: -12%; bottom: -20%; animation-delay: 1.5s; }
    main { position: relative; z-index: 1; text-align: center; }
    h1 {
      font-size: clamp(2.8rem, 9vw, 6.5rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.045em;
      text-shadow: 0 8px 35px rgba(0, 0, 0, .2);
      animation: appear .9s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes glow { from { transform: scale(.9); opacity: .65; } to { transform: scale(1.12); opacity: 1; } }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
  </main>
</body>
</html>
